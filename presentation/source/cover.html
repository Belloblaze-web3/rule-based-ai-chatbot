<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container {
      width: 1280px;
      min-height: 720px;
      background: #18181B;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cover-image {
      display: block;
      width: 1280px;
      height: 720px;
      object-fit: cover;
      object-position: center 30%;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <img class="cover-image" src="../assets/website-cover-16x9.jpg" alt="RuleBot website screenshot">
  </div>
</body>
</html>
