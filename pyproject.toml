[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rule-based-ai-chatbot"
version = "1.0.0"
description = "A transparent, deterministic rule-based chatbot for an AI engineering training project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RuleBot Project" }]
dependencies = []

[project.scripts]
rule-chatbot = "rule_based_ai_chatbot.cli:main"

[tool.setuptools.packages.find]
include = ["rule_based_ai_chatbot*"]
